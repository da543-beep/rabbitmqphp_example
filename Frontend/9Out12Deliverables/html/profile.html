<html>
<script>

function HandleLogoutRequest(username,session_key)
{
	var request = new XMLHttpRequest();
	request.open("POST", "logout.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function()

	{
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleLogoutResponse(this.responseText);
		}
	}
	request.send("type=logout&session_key="+session_key+"&username="+username);
}

function HandleLogoutResponse(response)
{
	var text = JSON.parse(response);
	if (text["success"] === true)
	{
		document.cookie = "SessionTest=; Max-age=0; path=/;";
		document.cookie = "SessionUsername=; Max-age=0; path=/;";
		window.location.href = "index.html"
	}
	else
	{
		alert("Logout Failed");
	}
}
function HandleGameRegistrationResponse(response)
{
	var text = JSON.parse(response);
	//document.getElementById("textResponse").textContent = "response: " + JSON.stringify(text)
	if (text["success"] == true)
	{
		alert("Game Registration Successful: " + (text["game"]));
	}
	else
	{
		alert("Game Registration Failed: " + text["message"]);
	}
}
function SendGameRegistration(username, game_name, platform)
{
	username = window.username;
	var request = new XMLHttpRequest();
	request.open("POST","library.php","true"); //check name
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange = function()
	{
	if ((this.readyState == 4)&&(this.status == 200))
	{
		HandleGameRegistrationResponse(this.responseText);
	}
	}
	request.send("type=add_to_library&username="+username+"&game_name="+game_name+"&platform="+platform);
	//request.send("type=add_to_library&game_name="+game_name+"&platform="+platform);
}

function DisplaySavedGames(games)
{
	var results = document.getElementById("libraryResults");
	results.replaceChildren();

	if (games.length === 0)
	{
		document.getElementById("libraryResults").textContent = "No saved games found.";
		return;
	}
	document.getElementById("libraryResults").textContent = "Showing library containing " + games.length + "game(s).";

	games.forEach(function(game)
	{
		var card = document.createElement("article");

		var title = document.createElement("h2");
		title.textContent = game.game_name;

		var platform = document.createElement("p");
		platform.textContent = "Platform: " + (game.platform);

		card.appendChild(title);
		card.appendChild(platform);
		results.appendChild(card);
	});
}

function ViewLibrary(username)
{
	var request = new XMLHttpRequest();
	request.open("POST", "viewLibrary.php", "true"); //check name
	request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
	request.onreadystatechange = function()
	{
		if((this.readyState == 4)&&(this.status == 200))
		{
			var text = JSON.parse(this.responseText);
			DisplaySavedGames(text.games);
			//the above lines need to be changed to actually print the repsonse
		}
	}
	request.send("type=get_library&username="+username);
}			

function HandleLibraryResponse(response)
{
	var text = JSON.parse(response);
	if (!text || text.success !== true)
	{
		document.getElementById("libraryResults").textContent = (text && text.message) || "No added games";
		return;
	}
	if (!Array.isArray(text.games))
	{
		document.getElementById("libraryResults").textContent = "No valid game saved";
		return;
	}
	DisplaySavedGames(text.games);
}

function HandleSessionResponse(response)
{
	var text = JSON.parse(response);
	//document.getElementById("textResponse").innerHTML = response+"<p>";
	//document.getElementById("textResponse").innerHTML = "response: "+text+"<p>";
	//document.getElementById("welcomeResponse").textContent = "response: " + JSON.stringify(text["username"]);
	if (text["success"] !== true)
	{
		alert("Session expired or failed: " + text["message"]);
		window.location.href = "index.html";
	}

}
function SendSessionRequest(session_key)
{
	var request = new XMLHttpRequest();
	request.open("POST","validateSession.php",true); //check file name
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function ()
	{
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleSessionResponse(this.responseText);
		}
	}
	request.send("type=session_validate&session_key="+session_key);
}
</script>

<p id="cookieOutput"></p>
<script>
	var username = "";
	window.onload = function()
	{
		const cookies = document.cookie
			.split(";")
			.map(c => c.trim());

		const sessionCookie = cookies.find(
			c => c.startsWith("SessionTest=")
		);

		const usernameCookie = cookies.find(
			c => c.startsWith("SessionUsername=")
		);

		const session_key = sessionCookie
		? decodeURIComponent(
			sessionCookie.substring("SessionTest=".length)
			)
		: "";

		window.username = usernameCookie
		? decodeURIComponent(
			usernameCookie.substring("SessionUsername=".length)
			)
		: "";


		document.getElementById("logoutButton").onclick = function ()
		{
			HandleLogoutRequest(username, session_key);
		};
		
		document.getElementById("viewLibraryButton").onclick = function()
		{
			ViewLibrary(username);
		};

		SendSessionRequest(session_key);
	};

</script>

<body>
	<h1>Profile</h1>
	<button type="button" onclick="window.location.href='landing.html'">Main Page</button>
	<button type="button" id="logoutButton">Logout</button>
	<br>
	<button type="button" onclick="window.location.href='discussion.html'">Join our disscussion post</button>


	<h2>Add a Game to Your Library</h2>
	<form>
	<label for="game_name">Game Name:</label>
	<input type="text" id="game_name" name="game_name">

	<br><br>

	<label for="platform">Platform:</label>
	<input type="text" id="platform" name="platform">
	
	<br><br>

	<button type="button" onclick="SendGameRegistration(window.username, 
		document.getElementById('game_name').value,
		document.getElementById('platform').value);">Add Game</button>

	</form>
	<br><br>
	
	<button type="button" id="viewLibraryButton">View Library</button>
	<div id="libraryResults"></div>
</body>
</html>
