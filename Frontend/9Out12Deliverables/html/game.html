<html>
	<head>
		</title>Game Details</title>
	</head>

<body>
	<h1 id="gameTitle"></h1>
	
	<img id="gameImage" width="300">
	<p id="gameGenre"></p>
	<p id="gamePlatform"></p>
	<p id="gameReleaseDate"></p>

	<script>

		window.onload = function()
		{
		const cookies = document.cookie
			.split(";")
			.map(c => c.trim());

		const sessionCookie = cookies.find(
			c => c.startsWith("SessionTest=")
		);

		const usernameCookie = cookies.find(
			c => c.startsWith("SessionUsername=")
		);

		const session_key = sessionCookie
		? decodeURIComponent(
			sessionCookie.substring("SessionTest=".length)
			)
		: "";

		window.username = usernameCookie
		? decodeURIComponent(
			usernameCookie.substring("SessionUsername=".length)
			)
		: "";


		document.getElementById("logoutButton").onclick = function ()
		{
			HandleLogoutRequest(username, session_key);
		};

		SendSessionRequest(session_key);
		};

		function HandleGameRegistrationResponse(response)
		{
			var text = JSON.parse(response);
			//document.getElementById("textResponse").textContent = "response: " + JSON.stringify(text)
			if (text["success"] == true)
			{
				alert("Game Registration Successful");
			}
			else
			{
			alert("Game Registration Failed: " + text["message"]);
			}
		}

		function SendGameRegistration(username, game_id)
		{
			username = window.username;
			var request = new XMLHttpRequest();
			request.open("POST","library.php","true"); //check name
			request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
			request.onreadystatechange = function()
			{
			if ((this.readyState == 4)&&(this.status == 200))
			{
			HandleGameRegistrationResponse(this.responseText);
			}
			}
			request.send("type=add_to_library&username="+username+"&game_id="+game_id);
			//request.send("type=add_to_library&game_name="+game_name+"&platform="+platform);
		}

		function HandleSessionResponse(response)
		{
			var text = JSON.parse(response);
			//document.getElementById("textResponse").innerHTML = response+"<p>";
			//document.getElementById("textResponse").innerHTML = "response: "+text+"<p>";
			//document.getElementById("welcomeResponse").textContent = "response: " + JSON.stringify(text["username"]);
			if (text["success"] !== true)
			{
				alert("Session expired or failed: " + text["message"]);
				window.location.href = "index.html";
			}

		}
		
		function SendSessionRequest(session_key)
		{
			var request = new XMLHttpRequest();
			request.open("POST","validateSession.php",true); //check file name
			request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
			request.onreadystatechange= function ()
			{
			if ((this.readyState == 4)&&(this.status == 200))
			{
				HandleSessionResponse(this.responseText);
			}
			}
			request.send("type=session_validate&session_key="+session_key);
		}





		var storedGame = sessionStorage.getItem("selectedGame");

		if (storedGame)
		{
			var game = JSON.parse(storedGame);

			document.getElementById("gameTitle").textContent = game.name;

			document.getElementById("gameGenre").textContent = "Genres: " + game.genre;

			document.getElementById("gamePlatform").textContent = "Plaforms: " + game.platform;

			document.getElementById("gameReleaseDate").textContent = "Release Date: " + game.releaseDate;

			document.getElementById("gameImage").src = game.URL.replace("t_thumb", "t_cover_big");
		}

	</script>


	<br><br>

	<button type="button" onclick="SendGameRegistration(window.username, game.gameID);">Add This Game To Your Library</button>
	
	<br><br>
	<button type="button" onclick="window.location.href='landing.html'">Main Page</button>
	<button type="button" id="logoutButton">Logout</button>
	<br>
	<button type="button" onclick="window.location.href='discussion.html'">Join our disscussion post</button>

</body>
</html>
