<html>
<script>

function HandleLogoutRequest(username,session_key)
{
	var request = new XMLHttpRequest();
	request.open("POST", "logout.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function()

	{
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleLogoutResponse(this.responseText);
		}
	}
	request.send("type=logout&session_key="+session_key+"&username="+username);


}

function HandleLogoutResponse(response)
{
	var text = JSON.parse(response);
	if (text["success"] === true)
	{
		document.cookie = "SessionTest=; Max-age=0; path=/;";
		document.cookie = "SessionUsername=; Max-age=0; path=/;";
		window.location.href = "index.html"
	}
	else
	{
		alert("Logout Failed");
	}
}


function HandleSessionResponse(response)
{
var text = JSON.parse(response);
//document.getElementById("textResponse").innerHTML = response+"<p>";
//document.getElementById("textResponse").innerHTML = "response: "+text+"<p>";
//document.getElementById("welcomeResponse").textContent = "response: " + JSON.stringify(text["username"]);

if (text["success"] !== true)
{

	alert("Session expired or failed: " + text["message"]);
	window.location.href = "index.html";
}

}


function SendSessionRequest(session_key)
{
var request = new XMLHttpRequest();
request.open("POST","validateSession.php",true); //check file name
request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
request.onreadystatechange= function ()
{

if ((this.readyState == 4)&&(this.status == 200))
{
HandleSessionResponse(this.responseText);
}
}
request.send("type=session_validate&session_key="+session_key);
}
</script>

<p id="cookieOutput"></p>
<script>
	window.onload = function()
	{
		const cookies = document.cookie
			.split(";")
			.map(c => c.trim());

		const sessionCookie = cookies.find(
			c => c.startsWith("SessionTest=")
		);

		const usernameCookie = cookies.find(
			c => c.startsWith("SessionUsername=")
		);

		const session_key = sessionCookie
		? decodeURIComponent(
			sessionCookie.substring("SessionTest=".length)
			)
		: "";

		const username = usernameCookie
		? decodeURIComponent(
			usernameCookie.substring("SessionUsername=".length)
			)
		: "";


		document.getElementById("logoutButton").onclick = function ()
		{
			HandleLogoutRequest(username, session_key);
		};

		SendSessionRequest(session_key);

	};
